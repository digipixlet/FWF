<style>
:root {
  --bg: #EEF3F8;
  --surface: #FFFFFF;
  --surface2: #F4F7FB;
  --ink: #0A1929;
  --sub: #4A6070;
  --dim: #7A98B0;
  --border: #C0D4E6;
  --border-light: #DDE8F2;
  --accent: #0090E0;
  --accent-dk: #005FA0;
  --gold: #9A7000;
  --gold-bg: #FDF6E3;
  --vo-c: #0090E0;
  --sot-c: #9A7000;
  --text-c: #1A90A8;
  --silent-c: #5A7888;
  --completed-c: #1A9E5A; --completed-bg: #E8F8EF;
  --existing-c: #0070C0; --existing-bg: #E3EFF8;
  --proposed-c: #7040C8; --proposed-bg: #EDE8F8;
  --dev-c: #C06000; --dev-bg: #FBF0E2;
  --final-c: #008898; --final-bg: #E2F4F6;
  --placeholder-c: #C02828; --placeholder-bg: #FAEBEB;
  --note-bg: #FFF8E8;
  --note-border: #D4A020;
  --row-stripe: #F7FAFD;
  --appr-bg: #E8F6EE; --appr-c: #1A8A4C;
  --rev-bg: #FFF0E0; --rev-c: #C05500;
  --hold-bg: #F0EAFA; --hold-c: #6040B0;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #050D15; --surface: #0B1929; --surface2: #0D2235;
    --ink: #D5E8F5; --sub: #6888A0; --dim: #3C5468;
    --border: #162840; --border-light: #1C3550;
    --accent: #0090E0; --accent-dk: #40B8FF;
    --gold: #FBB708; --gold-bg: #1A1400;
    --vo-c: #4DB8FF; --sot-c: #FBB708; --text-c: #50CCE0; --silent-c: #7898A8;
    --completed-c: #40D080; --completed-bg: #042010;
    --existing-c: #4DB0FF; --existing-bg: #041828;
    --proposed-c: #A080E8; --proposed-bg: #120A28;
    --dev-c: #F0A040; --dev-bg: #1A0C00;
    --final-c: #30C0D0; --final-bg: #041820;
    --placeholder-c: #F06060; --placeholder-bg: #1A0404;
    --note-bg: #0F0900; --note-border: #C09030;
    --row-stripe: #0D2035;
    --appr-bg: #041810; --appr-c: #40D080;
    --rev-bg: #180A00; --rev-c: #F0A040;
    --hold-bg: #0C0620; --hold-c: #A080E8;
  }
}
:root[data-theme="dark"] {
  --bg: #050D15; --surface: #0B1929; --surface2: #0D2235;
  --ink: #D5E8F5; --sub: #6888A0; --dim: #3C5468;
  --border: #162840; --border-light: #1C3550;
  --accent: #0090E0; --accent-dk: #40B8FF;
  --gold: #FBB708; --gold-bg: #1A1400;
  --vo-c: #4DB8FF; --sot-c: #FBB708; --text-c: #50CCE0; --silent-c: #7898A8;
  --completed-c: #40D080; --completed-bg: #042010;
  --existing-c: #4DB0FF; --existing-bg: #041828;
  --proposed-c: #A080E8; --proposed-bg: #120A28;
  --dev-c: #F0A040; --dev-bg: #1A0C00;
  --final-c: #30C0D0; --final-bg: #041820;
  --placeholder-c: #F06060; --placeholder-bg: #1A0404;
  --note-bg: #0F0900; --note-border: #C09030;
  --row-stripe: #0D2035;
  --appr-bg: #041810; --appr-c: #40D080;
  --rev-bg: #180A00; --rev-c: #F0A040;
  --hold-bg: #0C0620; --hold-c: #A080E8;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Barlow', sans-serif;
  font-size: 13px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ── Masthead ── */
.masthead {
  background: var(--accent);
  color: #fff;
  padding: 0;
  position: relative;
  overflow: hidden;
}
.masthead-inner {
  display: flex;
  align-items: stretch;
  min-height: 100px;
}
.masthead-left {
  padding: 24px 32px;
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 6px;
}
.masthead-eyebrow {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  opacity: 0.72;
}
.masthead-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 38px;
  font-weight: 900;
  letter-spacing: 0;
  line-height: 1.05;
  text-wrap: balance;
}
.masthead-sub {
  font-size: 13px;
  font-weight: 500;
  opacity: 0.8;
  margin-top: 2px;
}
.masthead-meta {
  padding: 24px 32px;
  border-left: 1px solid rgba(255,255,255,0.2);
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 8px;
  min-width: 220px;
  background: rgba(0,0,0,0.12);
}
.meta-item { display: flex; flex-direction: column; gap: 1px; }
.meta-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  opacity: 0.6;
}
.meta-value {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 15px;
  font-weight: 700;
  opacity: 1;
}
.masthead-accent {
  width: 8px;
  background: #FBB708;
  flex-shrink: 0;
}

/* ── Legend ── */
.legend {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 12px 32px;
  display: flex;
  align-items: center;
  gap: 32px;
  flex-wrap: wrap;
}
.legend-group {
  display: flex;
  align-items: center;
  gap: 16px;
}
.legend-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--dim);
}
.legend-items {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 500;
  color: var(--sub);
}
.legend-swatch {
  width: 10px;
  height: 10px;
  border-radius: 2px;
  flex-shrink: 0;
}
.legend-pill {
  padding: 2px 7px;
  border-radius: 3px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.5px;
}
.legend-div {
  width: 1px;
  height: 28px;
  background: var(--border);
}

/* ── Chapter header ── */
.chapter-header {
  display: flex;
  align-items: center;
  background: var(--ink);
  color: #fff;
  padding: 0 0 0 32px;
  margin-top: 24px;
  break-inside: avoid;
}
.chapter-num {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 52px;
  font-weight: 900;
  opacity: 0.18;
  line-height: 1;
  margin-right: 18px;
  flex-shrink: 0;
  color: #fff;
}
.chapter-info {
  flex: 1;
  padding: 14px 0;
}
.chapter-eyebrow {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  opacity: 0.5;
}
.chapter-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.chapter-bar {
  width: 6px;
  align-self: stretch;
  background: #FBB708;
  margin-left: auto;
  flex-shrink: 0;
}

/* ── Shot table wrapper ── */
.shots-wrapper {
  padding: 0 32px 0 32px;
}

/* ── Shot row ── */
.shot-row {
  display: grid;
  grid-template-columns: 88px 1fr 90px;
  border-bottom: 1px solid var(--border-light);
  background: var(--surface);
  break-inside: avoid;
}
.shot-row:nth-child(even) { background: var(--row-stripe); }
.shot-row.approved { background: var(--appr-bg) !important; }
.shot-row.revise   { background: var(--rev-bg)  !important; }
.shot-row.hold     { background: var(--hold-bg) !important; }

/* left sidebar */
.shot-left {
  padding: 12px 10px 12px 0;
  border-right: 1px solid var(--border-light);
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
  position: relative;
}
.shot-left::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 4px;
  border-radius: 0;
}
.shot-left.vo::before { background: var(--vo-c); }
.shot-left.sot::before { background: var(--sot-c); }
.shot-left.text::before { background: var(--text-c); }
.shot-left.silent::before { background: var(--silent-c); }

.shot-num {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 26px;
  font-weight: 900;
  color: var(--ink);
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.shot-tc {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px;
  font-weight: 700;
  color: var(--sub);
  text-align: right;
  letter-spacing: 0.3px;
  font-variant-numeric: tabular-nums;
}
.shot-dur {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 9px;
  font-weight: 600;
  color: var(--dim);
  text-align: right;
  letter-spacing: 0.5px;
}
.audio-badge {
  display: inline-block;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 2px 5px;
  border-radius: 2px;
  margin-top: 4px;
}
.audio-badge.vo    { background: var(--vo-c); color: #fff; }
.audio-badge.sot   { color: var(--sot-c); background: var(--gold-bg); border: 1px solid var(--sot-c); }
.audio-badge.text  { color: var(--text-c); background: rgba(26,144,168,0.12); border: 1px solid var(--text-c); }
.audio-badge.silent { color: var(--silent-c); background: rgba(90,120,136,0.10); border: 1px solid var(--silent-c); }

/* middle content */
.shot-mid {
  padding: 11px 14px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.shot-scene {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.3px;
  color: var(--ink);
  text-transform: uppercase;
}
.shot-visual {
  font-size: 12px;
  color: var(--sub);
  line-height: 1.5;
}
.shot-audio {
  font-size: 12px;
  font-style: italic;
  color: var(--ink);
  line-height: 1.5;
  padding: 5px 8px;
  border-left: 2px solid var(--border);
  background: var(--surface2);
  border-radius: 0 3px 3px 0;
  margin-top: 1px;
}
.shot-note {
  font-size: 11px;
  color: #7A4800;
  line-height: 1.45;
  padding: 5px 8px 5px 24px;
  background: var(--note-bg);
  border: 1px solid #E8B830;
  border-radius: 3px;
  position: relative;
  margin-top: 2px;
}
.shot-note::before {
  content: '⚠';
  position: absolute;
  left: 7px;
  top: 4px;
  font-size: 11px;
  color: #C08000;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .shot-note { color: #E8B060; }
}
:root[data-theme="dark"] .shot-note { color: #E8B060; }

/* right column — status + approval */
.shot-right {
  padding: 10px 10px 10px 10px;
  border-left: 1px solid var(--border-light);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.status-badge {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  padding: 3px 6px;
  border-radius: 3px;
  text-align: center;
  line-height: 1.3;
  width: 100%;
}
.approval-group {
  display: flex;
  flex-direction: column;
  gap: 3px;
  width: 100%;
}
.appr-btn {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.3px;
  padding: 3px 4px;
  border-radius: 3px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--dim);
  cursor: pointer;
  text-align: center;
  transition: background 0.12s, color 0.12s, border-color 0.12s;
  width: 100%;
}
.appr-btn:hover { border-color: var(--sub); color: var(--sub); }
.appr-btn.active-appr { background: var(--appr-bg); color: var(--appr-c); border-color: var(--appr-c); }
.appr-btn.active-rev  { background: var(--rev-bg);  color: var(--rev-c);  border-color: var(--rev-c); }
.appr-btn.active-hold { background: var(--hold-bg); color: var(--hold-c); border-color: var(--hold-c); }

/* ── Review summary bar ── */
.review-bar {
  display: flex;
  gap: 0;
  background: var(--surface);
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  margin-top: 24px;
}
.review-stat {
  flex: 1;
  padding: 16px 20px;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.review-stat:last-child { border-right: none; }
.review-count {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 32px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.review-stat-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--sub);
}

/* ── Sign-off ── */
.signoff {
  padding: 32px;
  background: var(--surface);
  border-top: 3px solid var(--accent);
  margin-top: 24px;
}
.signoff-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--ink);
  margin-bottom: 6px;
}
.signoff-sub {
  font-size: 12px;
  color: var(--sub);
  margin-bottom: 24px;
  max-width: 600px;
  line-height: 1.5;
}
.signoff-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 24px;
}
.sig-block { display: flex; flex-direction: column; gap: 4px; }
.sig-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--sub);
}
.sig-name {
  font-weight: 700;
  font-size: 13px;
  color: var(--ink);
  margin-bottom: 2px;
}
.sig-role { font-size: 12px; color: var(--sub); }
.sig-line {
  margin-top: 18px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 4px;
  font-size: 11px;
  color: var(--dim);
}
.sig-date-line { margin-top: 8px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }

/* ── Footer ── */
.doc-footer {
  text-align: center;
  padding: 16px 32px;
  font-size: 10px;
  color: var(--dim);
  letter-spacing: 0.5px;
}

/* ── Print ── */
@media print {
  body { font-size: 11px; }
  .masthead-title { font-size: 30px; }
  .chapter-num { font-size: 40px; }
  .shot-num { font-size: 20px; }
  .appr-btn, .approval-group { display: none; }
  .chapter-header { margin-top: 0; page-break-before: always; }
  .chapter-header:first-of-type { page-break-before: auto; }
  .shot-row { break-inside: avoid; }
}

.content-wrapper { max-width: 1100px; margin: 0 auto; }
</style>

// ── Storage ──────────────────────────────────────────────────────────────────
const KEY = 'fwf_shotlist_v1';
let approvals = {};
try { approvals = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(approvals)); } catch(e) {} }

// ── Render helpers ───────────────────────────────────────────────────────────
function audioClass(t) { return t.toLowerCase(); }

function statusBadge(s) {
  if (!s || !STATUS[s]) return '';
  const d = STATUS[s];
  return `<span class="status-badge" style="background:${d.bg};color:${d.c}">${d.label}</span>`;
}

function shotRow(shot, idx) {
  const t = audioClass(shot.type);
  const ap = approvals[shot.id] || '';
  return `
  <div class="shot-row${ap ? ' ' + ap : ''}" data-id="${shot.id}" id="row-${shot.id}">
    <div class="shot-left ${t}">
      <div class="shot-num">${String(idx).padStart(2,'0')}</div>
      <div class="shot-tc">${shot.tc}<br>${shot.tcOut}</div>
      <div class="shot-dur">${shot.dur}</div>
      <div class="audio-badge ${t}">${{VO:'VO',SOT:'SOT',TEXT:'TEXT',SILENT:'SILENT'}[shot.type]}</div>
    </div>
    <div class="shot-mid">
      <div class="shot-scene">${shot.scene}</div>
      <div class="shot-visual">${shot.visual}</div>
      <div class="shot-audio">${shot.audio}</div>
      ${shot.notes ? `<div class="shot-note">${shot.notes}</div>` : ''}
    </div>
    <div class="shot-right">
      ${shot.status ? statusBadge(shot.status) : '<div></div>'}
      <div class="approval-group">
        <button class="appr-btn${ap==='approved'?' active-appr':''}" onclick="setApproval('${shot.id}','approved',this)">✓ Approved</button>
        <button class="appr-btn${ap==='revise'?' active-rev':''}" onclick="setApproval('${shot.id}','revise',this)">↺ Revise</button>
        <button class="appr-btn${ap==='hold'?' active-hold':''}" onclick="setApproval('${shot.id}','hold',this)">⏸ Hold</button>
      </div>
    </div>
  </div>`;
}

function setApproval(id, state, btn) {
  const prev = approvals[id];
  if (prev === state) {
    delete approvals[id];
    approvals[id] = '';
  } else {
    approvals[id] = state;
  }
  save();
  renderAll();
  updateSummary();
}
window.setApproval = setApproval;

function updateSummary() {
  const vals = Object.values(approvals).filter(Boolean);
  document.getElementById('cnt-total').textContent = SHOTS.length;
  document.getElementById('cnt-appr').textContent = vals.filter(v=>v==='approved').length;
  document.getElementById('cnt-rev').textContent = vals.filter(v=>v==='revise').length;
  document.getElementById('cnt-hold').textContent = vals.filter(v=>v==='hold').length;
  document.getElementById('cnt-pend').textContent = SHOTS.length - vals.length;
}
